[EMC]
VERSION = 1.1
DEBUG = 0x0

[DISPLAY]
DISPLAY = ./test-ui.py

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[EMCIO]
TOOL_TABLE = simpockets.tbl

[HAL]
HALFILE = mock-motion.hal

[TRAJ]
NO_FORCE_HOMING = 1
COORDINATES = X Y Z A C
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 300
ORIENT_SMOOTH = 1
ORIENT_SMOOTH_MAX_LINES = 25

[KINS]
KINEMATICS = trivkins coordinates=XYZAC
JOINTS = 5


[AXIS_X]
MIN_LIMIT = -600
MAX_LIMIT = 600
MAX_VELOCITY = 250
MAX_ACCELERATION = 1250
MAX_JERK = 20000

[JOINT_0]
